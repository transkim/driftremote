plugins {
    id 'com.android.application'
}

android {
    namespace 'app.driftremote'
    compileSdk 35

    defaultConfig {
        applicationId 'app.driftremote'
        minSdk 21
        targetSdk 35
        versionCode 7
        versionName '0.2.2'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // A fixed key kept in the repo so every build installs over the previous one.
        // It is public, so use your own keystore before publishing to Google Play.
        sideload {
            storeFile file('driftremote.jks')
            storePassword 'driftremote'
            keyAlias 'driftremote'
            keyPassword 'driftremote'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    lint {
        checkOnly 'NewApi'
        abortOnError true
        checkReleaseBuilds false
    }

    androidResources {
        noCompress 'apk'
    }

    // The TV mouse app is built first and shipped inside the phone app, which
    // serves it on the Wi-Fi so the TV can download it.
    sourceSets {
        main {
            assets.srcDirs += layout.buildDirectory.dir('tvapk').get().asFile
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
}

def copyTvApk = tasks.register('copyTvApk', Copy) {
    dependsOn ':tv:assembleRelease'
    from(project(':tv').layout.buildDirectory.file('outputs/apk/release/tv-release.apk'))
    into(layout.buildDirectory.dir('tvapk'))
    rename { 'driftremote-tv.apk' }
}
tasks.named('preBuild') { dependsOn copyTvApk }
