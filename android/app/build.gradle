plugins {
    id 'com.android.application'
}

android {
    namespace 'app.driftremote'
    compileSdk 35

    defaultConfig {
        applicationId 'app.driftremote'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        // A fixed key kept in the repo so every build installs over the previous one.
        // It is public, so use your own keystore before publishing to Google Play.
        sideload {
            storeFile file('driftremote.jks')
            storePassword 'driftremote'
            keyAlias 'driftremote'
            keyPassword 'driftremote'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    lint {
        checkOnly 'NewApi'
        abortOnError true
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
